<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #000;
        font-family: "Inter", system-ui, sans-serif;
      }

      /* Video background */
      #a-roll {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        object-fit: cover;
      }

      /*
        Caption stage — perspective container so the text plane lies on the
        acoustic-foam wall in the upper-right of the frame. The wall is roughly
        at x>860, y<480, slightly angled. A perspective of 1400px with a
        rotateY(-10deg) + skewY(-2deg) makes the text conform to that plane.
      */
      #stage {
        position: absolute;
        top: 0; left: 0;
        width: 1280px; height: 720px;
        perspective: 1400px;
        perspective-origin: 30% 40%;
        pointer-events: none;
      }

      .wall-plane {
        position: absolute;
        /* Anchor to right side — over the foam wall */
        top: 60px;
        right: 40px;
        width: 640px;
        height: 500px;
        transform-style: preserve-3d;
        transform: rotateY(-14deg) rotateX(1.5deg);
        transform-origin: right center;
        /* Small inner padding so text doesn't kiss the edge */
        padding: 40px 50px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 14px;
      }

      /*
        Each caption line is absolutely positioned within the plane so they can
        stack into a "remembered" typography block — older lines fade into
        the wall while newer lines emerge on top.
      */
      .cap {
        display: block;
        position: relative;
        font-weight: 700;
        letter-spacing: -0.01em;
        line-height: 1.0;
        opacity: 0;
        /* The key "embed into the scene" trick: overlay blend picks up the
           foam wall's texture and light, so the text feels lit BY the scene. */
        mix-blend-mode: overlay;
        color: #f2eadf;                 /* warm bone white */
        text-shadow:
          0 0 18px rgba(255, 210, 150, 0.35),
          0 2px 6px rgba(0, 0, 0, 0.55);
        /* Start blurred & faded — "memory" state */
        filter: blur(5px) brightness(1.05) contrast(0.95);
      }

      .cap .w {
        display: inline-block;
        transform-origin: 50% 100%;
        opacity: 0.25;
        will-change: opacity, transform, color, filter;
        transition: none;
      }

      /* Size hierarchy — headline phrase is biggest, detail phrase smaller */
      .cap-1 { font-size: 72px; font-style: italic; font-weight: 600; }
      .cap-2 { font-size: 58px; font-style: italic; font-weight: 500;
               padding-left: 46px; /* hanging indent, handwritten feel */ }
      .cap-3 { font-size: 62px; font-weight: 700;
               font-style: normal; letter-spacing: -0.02em; }
      .cap-4 { font-size: 82px; font-weight: 900;
               letter-spacing: -0.03em; text-transform: uppercase; }

      /* Grain — only visible in "memory" half. Uses SVG noise via data URL */
      #grain {
        position: absolute; inset: 0;
        background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='2.6' numOctaves='2' stitchTiles='stitch' seed='7'/><feColorMatrix values='0 0 0 0 0.85   0 0 0 0 0.78   0 0 0 0 0.62   0 0 0 1.5 -0.5'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
        mix-blend-mode: overlay;
        opacity: 0;
        pointer-events: none;
      }

      /* Warm sepia vignette for memory phase */
      #vignette-warm {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse at 40% 45%, transparent 30%, rgba(60, 30, 10, 0.35) 75%, rgba(30, 15, 5, 0.6) 100%);
        mix-blend-mode: multiply;
        opacity: 0;
        pointer-events: none;
      }

      /* Focus-pull white flash that happens at "suddenly" */
      #focus-flash {
        position: absolute; inset: 0;
        background: radial-gradient(circle at 50% 45%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.6) 25%, transparent 60%);
        mix-blend-mode: screen;
        opacity: 0;
        pointer-events: none;
      }

      /* Aperture ring — a racking-focus hint that appears at the snap moment */
      #aperture {
        position: absolute;
        top: 50%; left: 50%;
        width: 260px; height: 260px;
        margin: -130px 0 0 -130px;
        border: 2px solid rgba(255,255,255,0.85);
        border-radius: 50%;
        opacity: 0;
        pointer-events: none;
        box-shadow:
          0 0 40px rgba(255,255,255,0.25),
          inset 0 0 40px rgba(255,255,255,0.15);
      }
      #aperture::before, #aperture::after {
        content: "";
        position: absolute;
        background: rgba(255,255,255,0.7);
      }
      #aperture::before {
        top: 50%; left: -18px; right: -18px; height: 1px;
      }
      #aperture::after {
        left: 50%; top: -18px; bottom: -18px; width: 1px;
      }

      /* Ghost caption: faded imprint of earlier caption sinks into the wall */
      .cap.ghost {
        mix-blend-mode: overlay;
        opacity: 0.15;
        filter: blur(8px) contrast(0.8);
      }

      /* Sharp state modifier — gets applied via GSAP */
      /* no class needed — handled by tween properties directly */
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8.04"
      data-width="1280"
      data-height="720"
    >
      <video
        id="a-roll"
        class="clip"
        src="source.mp4"
        muted
        playsinline
        data-duration="8.04"
        data-track-index="0"
      ></video>
      <audio
        id="a-roll-audio"
        src="source.mp4"
        data-start="0"
        data-duration="8.04"
        data-track-index="1"
        data-volume="1"
      ></audio>

      <!-- full-frame effect overlays -->
      <div id="vignette-warm" data-start="0" data-duration="8.04" data-track-index="2"></div>
      <div id="grain" data-start="0" data-duration="8.04" data-track-index="3"></div>

      <!-- Perspective stage holding the wall-plane caption stack -->
      <div id="stage" data-start="0" data-duration="8.04" data-track-index="4">
        <div class="wall-plane">
          <!-- Group 1: "Some memories feel soft" -->
          <div id="cg-0" class="cap cap-1">
            <span class="w" data-i="0">Some</span>
            <span class="w" data-i="1">memories</span>
            <span class="w" data-i="2">feel</span>
            <span class="w" data-i="3">soft</span>
          </div>
          <!-- Group 2: "like old film" -->
          <div id="cg-1" class="cap cap-2">
            <span class="w" data-i="0">like</span>
            <span class="w" data-i="1">old</span>
            <span class="w" data-i="2">film</span>
          </div>
          <!-- Group 3: "but suddenly" -->
          <div id="cg-2" class="cap cap-3">
            <span class="w" data-i="0">but</span>
            <span class="w" data-i="1">suddenly</span>
          </div>
          <!-- Group 4: "everything is SHARP again" -->
          <div id="cg-3" class="cap cap-4">
            <span class="w" data-i="0">everything</span>
            <span class="w" data-i="1">is</span>
            <span class="w" data-i="2">sharp</span>
            <span class="w" data-i="3">again</span>
          </div>
        </div>
      </div>

      <!-- focus snap overlays, above everything -->
      <div id="focus-flash" data-start="0" data-duration="8.04" data-track-index="5"></div>
      <div id="aperture" data-start="0" data-duration="8.04" data-track-index="6"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* ─────────────────────────────────────────────────────────────────
         Transcript — ElevenLabs word-level timings (more accurate than
         the whisper transcript.json which had a 0-duration "everything").
         ───────────────────────────────────────────────────────────────── */
      const GROUPS = [
        {
          id: "cg-0",
          words: [
            { text: "Some",     start: 0.24, end: 0.44 },
            { text: "memories", start: 0.48, end: 0.82 },
            { text: "feel",     start: 0.90, end: 1.14 },
            { text: "soft",     start: 1.20, end: 1.64 },
          ],
          in: 0.20, out: 4.95,
          phase: "soft",
        },
        {
          id: "cg-1",
          words: [
            { text: "like", start: 2.66, end: 2.78 },
            { text: "old",  start: 2.86, end: 3.02 },
            { text: "film", start: 3.14, end: 3.46 },
          ],
          in: 2.55, out: 4.95,
          phase: "soft",
        },
        {
          id: "cg-2",
          words: [
            { text: "but",      start: 5.02, end: 5.16 },
            { text: "suddenly", start: 5.22, end: 5.76 },
          ],
          in: 4.98, out: 8.04,
          phase: "sharp",
        },
        {
          id: "cg-3",
          words: [
            { text: "everything", start: 6.80, end: 7.14 },
            { text: "is",         start: 7.16, end: 7.28 },
            { text: "sharp",      start: 7.30, end: 7.52 },
            { text: "again",      start: 7.56, end: 7.92 },
          ],
          in: 6.70, out: 8.04,
          phase: "sharp",
        },
      ];

      const SNAP = 4.98; // "suddenly" boundary — the focus-pull moment

      /* ─────────────────────────────────────────────────────────────────
         Pre-snap atmosphere: warm vignette + grain build during the
         "soft like old film" half, then evaporate at the snap.
         ───────────────────────────────────────────────────────────────── */
      tl.to("#vignette-warm", { opacity: 0.7, duration: 0.8, ease: "power2.out" }, 0.1);
      tl.to("#grain",         { opacity: 0.55, duration: 0.8, ease: "power2.out" }, 0.1);

      /* Grain/vignette fade out at the snap */
      tl.to("#vignette-warm", { opacity: 0,    duration: 0.35, ease: "power2.in" },  SNAP - 0.05);
      tl.to("#grain",         { opacity: 0.08, duration: 0.35, ease: "power2.in" },  SNAP - 0.05);

      /* ─────────────────────────────────────────────────────────────────
         Focus-pull moment at SNAP: aperture ring pulse + white bloom.
         This sells the sentence's turn from memory → present clarity.
         ───────────────────────────────────────────────────────────────── */
      tl.fromTo(
        "#aperture",
        { opacity: 0, scale: 1.6 },
        { opacity: 0.8, scale: 1.0, duration: 0.28, ease: "power3.out" },
        SNAP
      );
      tl.to("#aperture", { opacity: 0, scale: 0.6, duration: 0.45, ease: "power2.in" }, SNAP + 0.35);

      tl.fromTo(
        "#focus-flash",
        { opacity: 0 },
        { opacity: 0.55, duration: 0.12, ease: "power2.out" },
        SNAP
      );
      tl.to("#focus-flash", { opacity: 0, duration: 0.55, ease: "power3.in" }, SNAP + 0.1);

      /* ─────────────────────────────────────────────────────────────────
         Each caption group: enter, karaoke its words, then behave as its
         phase demands — soft groups stay dreamy and get "sunk" into the
         wall as an overlay ghost, sharp groups snap in crisp.
         ───────────────────────────────────────────────────────────────── */
      GROUPS.forEach(function (g) {
        const sel = "#" + g.id;
        const words = g.words.map(function (_, i) { return sel + " .w[data-i='" + i + "']"; });

        if (g.phase === "soft") {
          /* Entrance: float in from deeper in the wall. blurred warm state. */
          tl.fromTo(
            sel,
            { opacity: 0, z: -80, y: 18, filter: "blur(14px) brightness(1.1)" },
            {
              opacity: 1, z: 0, y: 0,
              filter: "blur(4px) brightness(1.05) contrast(0.95)",
              duration: 0.65, ease: "power3.out",
            },
            g.in
          );
          /* color & blend for soft phase — warm amber */
          tl.set(sel, { color: "#f5ddb4" }, g.in);

          /* Karaoke: each word warms up and faintly blooms as spoken. */
          g.words.forEach(function (w, i) {
            tl.to(
              words[i],
              {
                opacity: 1,
                scale: 1.02,
                color: "#ffe9c2",
                textShadow: "0 0 26px rgba(255, 210, 150, 0.8), 0 2px 6px rgba(0,0,0,0.55)",
                duration: 0.22, ease: "power2.out",
              },
              w.start
            );
            tl.to(
              words[i],
              {
                scale: 1.0,
                opacity: 0.85,
                textShadow: "0 0 14px rgba(255, 210, 150, 0.35), 0 2px 6px rgba(0,0,0,0.55)",
                duration: 0.35, ease: "power2.out",
              },
              w.end + 0.05
            );
          });

          /* At the snap, soft groups sink into the wall as ghosts. */
          tl.to(
            sel,
            {
              opacity: 0.18, filter: "blur(10px) contrast(0.7)",
              color: "#a07a55",
              duration: 0.4, ease: "power3.inOut",
            },
            SNAP
          );
          /* Final hard kill */
          tl.to(sel, { opacity: 0, duration: 0.25, ease: "power2.in" }, g.out - 0.25);
          tl.set(sel, { opacity: 0, visibility: "hidden" }, g.out);
        }

        if (g.phase === "sharp") {
          /* Pre-snap: element exists but fully hidden, no blur */
          tl.set(
            sel,
            {
              opacity: 0,
              color: "#ffffff",
              filter: "blur(0px) brightness(1.15)",
              mixBlendMode: "normal",
            },
            0
          );
          g.words.forEach(function (_, i) {
            tl.set(words[i], { opacity: 0 }, 0);
          });

          /* Entrance — hard cut with overshoot, near the snap */
          tl.fromTo(
            sel,
            { opacity: 0, y: -30, scale: 1.08, filter: "blur(3px) brightness(1.15)" },
            {
              opacity: 1, y: 0, scale: 1.0,
              filter: "blur(0px) brightness(1.1)",
              duration: 0.35, ease: "back.out(1.6)",
            },
            g.in
          );

          /* Sharp karaoke: words stamp in one by one, each with a
             punchy scale pop and a razor drop shadow so they look
             pressed INTO the foam, not floating on top. */
          g.words.forEach(function (w, i) {
            tl.fromTo(
              words[i],
              { opacity: 0, y: -18, scale: 1.25, letterSpacing: "0.12em" },
              {
                opacity: 1, y: 0, scale: 1.0, letterSpacing: "-0.03em",
                duration: 0.18,
                ease: "power4.out",
              },
              w.start
            );
            /* post-stamp micro settle */
            tl.to(
              words[i],
              {
                textShadow:
                  "0 1px 0 rgba(255,255,255,0.7), 0 0 22px rgba(255,255,255,0.35), 0 4px 10px rgba(0,0,0,0.7)",
                duration: 0.2, ease: "power2.out",
              },
              w.start + 0.05
            );
          });

          /* The word "sharp" itself deserves emphasis — extra scale pop
             and a brief chromatic aberration glow. */
          if (g.id === "cg-3") {
            const sharpSel = sel + " .w[data-i='2']";
            tl.to(
              sharpSel,
              {
                scale: 1.18,
                color: "#fff",
                textShadow:
                  "1.5px 0 0 rgba(255,80,80,0.75), -1.5px 0 0 rgba(80,200,255,0.75), 0 0 32px rgba(255,255,255,0.9), 0 4px 14px rgba(0,0,0,0.8)",
                duration: 0.2, ease: "back.out(2)",
              },
              7.30
            );
            tl.to(
              sharpSel,
              {
                scale: 1.0,
                textShadow:
                  "0 1px 0 rgba(255,255,255,0.7), 0 0 22px rgba(255,255,255,0.35), 0 4px 10px rgba(0,0,0,0.7)",
                duration: 0.3, ease: "power2.out",
              },
              7.55
            );
          }

          /* Final hard kill — final group fades to black at the end. */
          if (g.out >= 8.0) {
            tl.to(sel, { opacity: 0.95, duration: 0.3, ease: "power2.in" }, 7.70);
          }
          tl.set(sel, { opacity: 0, visibility: "hidden" }, g.out);
        }
      });

      /* Self-lint: no group still visible past its end */
      GROUPS.forEach(function (g) {
        const el = document.getElementById(g.id);
        if (!el) return;
        tl.seek(g.out + 0.01);
        const cs = window.getComputedStyle(el);
        if (cs.opacity !== "0" && cs.visibility !== "hidden") {
          console.warn("[caption-lint] group " + g.id + " visible at t=" + (g.out + 0.01).toFixed(2));
        }
      });
      tl.seek(0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
