<!doctype html>
<!--
  Custom-mode skeleton — the MINIMUM hyperframes pipeline contract.
  Everything inside <style> and #stage is YOURS to design.

  What MUST stay (or render-and-composite.sh + matte overlay will fail):
    - <div id="root" data-composition-id="main" data-start data-duration data-width data-height>
    - <video id="a-roll" src="source.mp4" data-track-index="0" data-duration> (background plate)
    - <audio id="a-roll-audio" src="source.mp4" data-track-index="3" data-duration>
    - window.__timelines["main"] = tl;  (named composition the renderer captures)
    - GSAP timeline must be deterministic (no Math.random, no Date.now, no repeat:-1)
    - Captions live INSIDE #stage so the post-composite matte (PNG sequence)
      lays cleanly over them.

  What you decide freely:
    - All CSS (typography, layout, blend mode, color, shadows, filters)
    - All extra DOM layers (grain overlays, vignettes, focus flashes, etc.)
    - The GSAP timeline shape per element
    - The number and structure of caption groups, planes, etc.

  Embed effect requires:
    - Your text lives at z-index between #a-roll and the post-composite matte
    - mix-blend-mode picks up wall texture (overlay/screen/normal — pick by luminance)
    - The matte (frames_fg/*.png) overlays in post via ffmpeg, occluding text
      where the subject is in front of it
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{WIDTH}}, height={{HEIGHT}}" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: {{WIDTH}}px; height: {{HEIGHT}}px;
        overflow: hidden;
        background: #000;
        font-family: "Inter", system-ui, sans-serif;
      }
      #a-roll {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        object-fit: cover;
      }
      #stage {
        position: absolute;
        top: 0; left: 0;
        width: {{WIDTH}}px; height: {{HEIGHT}}px;
        pointer-events: none;
        z-index: 2;
      }

      /* ============================================================
         YOUR DESIGN GOES HERE.
         No preset classes, no required structure inside #stage.
         Reach for grain overlays, vignettes, perspective planes,
         per-position bespoke caption styles, focus flashes — whatever
         the scene asks for. See examples/ for inspiration.
         ============================================================ */
    </style>
  </head>
  <body>
    <div id="root"
         data-composition-id="main"
         data-start="0"
         data-duration="{{DURATION}}"
         data-width="{{WIDTH}}"
         data-height="{{HEIGHT}}">

      <video id="a-roll"
             src="source.mp4" muted playsinline
             data-duration="{{DURATION}}" data-track-index="0"
             style="z-index: 1"></video>

      <div id="stage">
        <!-- YOUR DOM GOES HERE.
             Caption groups, perspective planes, grain layers,
             vignettes, aperture rings — anything you want. -->
      </div>

      <audio id="a-roll-audio"
             src="source.mp4"
             data-start="0" data-duration="{{DURATION}}"
             data-track-index="3" data-volume="1"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const DUR = {{DURATION}};

      /* YOUR TIMELINE GOES HERE.
         No tone/style requirements — write the GSAP that fits the scene.
         Keep it deterministic: no Math.random, no Date.now, no repeat:-1. */

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
