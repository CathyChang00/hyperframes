<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{WIDTH}}, height={{HEIGHT}}" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: {{WIDTH}}px; height: {{HEIGHT}}px;
        overflow: hidden;
        background: #000;
        font-family: "Inter", system-ui, sans-serif;
      }

      #a-roll {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        object-fit: cover;
      }

      #stage {
        position: absolute;
        top: 0; left: 0;
        width: {{WIDTH}}px; height: {{HEIGHT}}px;
        perspective: 1400px;
        perspective-origin: 30% 40%;
        pointer-events: none;
        z-index: 2;
      }

      /* Perspective-transformed plane that lies on the back wall. All caps
         absolutely positioned within it so they stack at one location;
         only the active group is visible. */
      .wall-plane {
        position: absolute;
        top: {{WALL_TOP}}px;
        right: {{WALL_RIGHT}}px;
        width: {{WALL_WIDTH}}px;
        height: {{WALL_HEIGHT}}px;
        transform-style: preserve-3d;
        transform: rotateY({{WALL_ROTATE_Y}}deg) rotateX({{WALL_ROTATE_X}}deg);
        transform-origin: right center;
        padding: 30px;
      }
      .wall-plane .cap {
        position: absolute;
        top: 30px;
        right: 30px;
        max-width: calc(100% - 60px);
        text-align: right;
      }

      .cap {
        display: block;
        position: relative;
        line-height: 1.05;
        opacity: 0;
        /* Default: overlay (mid-tone wall). For dark shelves use `screen`,
           bright walls `normal`. Override via plan.json `blend_mode`. */
        mix-blend-mode: {{BLEND_MODE}};
        color: {{CAP_COLOR}};
        text-shadow:
          0 0 14px rgba(255, 210, 150, 0.55),
          0 2px 5px rgba(0, 0, 0, 0.7);
        filter: brightness(1.1) contrast(1.05);
        will-change: transform, opacity;
      }
      .cap .w {
        display: inline-block;
        opacity: 0;
        will-change: opacity, transform;
      }

      .cap-intro   { font-size: 70px; font-weight: 600; font-style: italic;
                     letter-spacing: -0.01em; }
      .cap-phrase  { font-size: 60px; font-weight: 500; font-style: italic;
                     letter-spacing: -0.005em; padding-right: 44px; }
      .cap-emph    { font-size: 66px; font-weight: 700;
                     letter-spacing: -0.015em; }
      .cap-crown   { font-size: 80px; font-weight: 900;
                     letter-spacing: -0.03em; text-transform: uppercase;
                     line-height: 1.0; }
    </style>
  </head>
  <body>
    <div id="root"
         data-composition-id="main"
         data-start="0"
         data-duration="{{DURATION}}"
         data-width="{{WIDTH}}"
         data-height="{{HEIGHT}}">
      <video id="a-roll" class="clip"
             src="source.mp4" muted playsinline
             data-duration="{{DURATION}}" data-track-index="0"
             style="z-index: 1"></video>

      <div id="stage">
        <div class="wall-plane">
        {{GROUPS_HTML}}
        </div>
      </div>

      <audio id="a-roll-audio" src="source.mp4"
             data-start="0" data-duration="{{DURATION}}"
             data-track-index="3" data-volume="1"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const DUR = {{DURATION}};
      const GROUPS = {{GROUPS_JSON}};

      GROUPS.forEach(function (g) {
        var sel = "#" + g.id;
        var words = g.words.map(function (_, i) { return sel + " .w[data-i='" + i + "']"; });
        var isSoft = g.tone === "soft";

        tl.set(sel, { opacity: 1, y: 0 }, Math.max(0, g.in - 0.01));

        g.words.forEach(function (w, i) {
          if (isSoft) {
            tl.fromTo(words[i],
              { opacity: 0, y: 8 },
              { opacity: 1, y: 0, duration: 0.42, ease: "power2.out", overwrite: "auto" },
              w.start);
          } else {
            tl.fromTo(words[i],
              { opacity: 0, y: 6, scale: 1.04 },
              { opacity: 1, y: 0, scale: 1.0, duration: 0.22,
                ease: "power3.out", transformOrigin: "50% 50%", overwrite: "auto" },
              w.start);
          }
        });

        if (g.out < DUR) {
          tl.to(sel, { opacity: 0, duration: 0.45, ease: "power2.in", overwrite: "auto" },
                g.out - 0.45);
        }
        tl.set(sel, { opacity: 0, visibility: "hidden" }, g.out);
      });

      GROUPS.forEach(function (g) {
        var el = document.getElementById(g.id);
        if (!el) return;
        tl.seek(g.out + 0.01);
        var cs = window.getComputedStyle(el);
        if (cs.opacity !== "0" && cs.visibility !== "hidden") {
          console.warn("[caption-lint] " + g.id + " visible at t=" + (g.out + 0.01).toFixed(2));
        }
      });
      tl.seek(0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
