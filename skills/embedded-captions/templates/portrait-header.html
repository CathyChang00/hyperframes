<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{WIDTH}}, height={{HEIGHT}}" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: {{WIDTH}}px; height: {{HEIGHT}}px;
        overflow: hidden;
        background: #000;
        font-family: "Inter", system-ui, sans-serif;
      }

      #a-roll {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        object-fit: cover;
      }

      #stage {
        position: absolute;
        top: 0; left: 0;
        width: {{WIDTH}}px; height: {{HEIGHT}}px;
        pointer-events: none;
        z-index: 2;
      }

      /* Portrait top-banner: a horizontal strip across the top of the
         frame, above the subject's head. Caps are absolutely positioned
         at the same location; hidden ones don't occupy layout. */
      .header-plane {
        position: absolute;
        top: {{WALL_TOP}}px;
        left: 0; right: 0;
        height: {{WALL_HEIGHT}}px;
        padding: 24px 40px;
      }
      .header-plane .cap {
        position: absolute;
        top: 24px;
        left: 40px; right: 40px;
        max-width: calc(100% - 80px);
        text-align: center;
      }

      /* Optional crown at bottom (if the shot leaves space below the
         subject's body — Randy-Pausch-style with waist visible). */
      .crown-plane {
        position: absolute;
        top: {{CROWN_TOP}}px;
        left: 0; right: 0;
        text-align: center;
        pointer-events: none;
      }

      .cap {
        display: block;
        position: relative;
        line-height: 1.05;
        opacity: 0;
        mix-blend-mode: {{BLEND_MODE}};
        color: {{CAP_COLOR}};
        text-shadow:
          0 0 18px rgba(255, 220, 170, 0.55),
          0 3px 8px rgba(0, 0, 0, 0.85);
        filter: brightness(1.12) contrast(1.08);
        will-change: transform, opacity;
      }
      .cap .w {
        display: inline-block;
        opacity: 0;
        will-change: opacity, transform;
      }

      /* Portrait sizes — tuned after user feedback that 58/70/82 felt
         visually underweight in 9:16. Landscape defaults ÷ 1.3 (not 1.5)
         gives more presence in narrow frame. */
      .cap-intro   { font-size: 72px; font-weight: 500; font-style: italic;
                     letter-spacing: -0.005em; line-height: 1.1; }
      .cap-phrase  { font-size: 88px; font-weight: 600;
                     letter-spacing: -0.015em; line-height: 1.05; }
      .cap-emph    { font-size: 104px; font-weight: 800;
                     letter-spacing: -0.025em; line-height: 1.0; }
      .cap-dream   { font-size: 92px; font-weight: 700; font-style: italic;
                     letter-spacing: -0.015em; line-height: 1.05; }
      .cap-crown   { font-size: 130px; font-weight: 900;
                     letter-spacing: -0.035em; text-transform: uppercase;
                     line-height: 1.0; }
    </style>
  </head>
  <body>
    <div id="root"
         data-composition-id="main"
         data-start="0"
         data-duration="{{DURATION}}"
         data-width="{{WIDTH}}"
         data-height="{{HEIGHT}}">
      <video id="a-roll" class="clip"
             src="source.mp4" muted playsinline
             data-duration="{{DURATION}}" data-track-index="0"
             style="z-index: 1"></video>

      <div id="stage">
        <div class="header-plane">
        {{GROUPS_HTML}}
        </div>
        <div class="crown-plane">
        {{CROWN_HTML}}
        </div>
      </div>

      <audio id="a-roll-audio" src="source.mp4"
             data-start="0" data-duration="{{DURATION}}"
             data-track-index="3" data-volume="1"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const DUR = {{DURATION}};

      const GROUPS = {{GROUPS_JSON}};
      const CROWN  = {{CROWN_JSON}};

      function animateGroup(g) {
        var sel = "#" + g.id;
        var words = g.words.map(function (_, i) { return sel + " .w[data-i='" + i + "']"; });
        var isSoft = g.tone === "soft";

        tl.set(sel, { opacity: 1, y: 0 }, Math.max(0, g.in - 0.01));

        g.words.forEach(function (w, i) {
          if (isSoft) {
            tl.fromTo(words[i],
              { opacity: 0, y: 8 },
              { opacity: 1, y: 0, duration: 0.42, ease: "power2.out", overwrite: "auto" },
              w.start);
          } else {
            tl.fromTo(words[i],
              { opacity: 0, y: 6, scale: 1.04 },
              { opacity: 1, y: 0, scale: 1.0, duration: 0.22,
                ease: "power3.out", transformOrigin: "50% 50%", overwrite: "auto" },
              w.start);
          }
        });

        if (g.out < DUR) {
          tl.to(sel, { opacity: 0, duration: 0.45, ease: "power2.in", overwrite: "auto" },
                g.out - 0.45);
        }
        tl.set(sel, { opacity: 0, visibility: "hidden" }, g.out);
      }

      GROUPS.forEach(animateGroup);
      if (CROWN) animateGroup(CROWN);

      var ALL = CROWN ? GROUPS.concat([CROWN]) : GROUPS;
      ALL.forEach(function (g) {
        var el = document.getElementById(g.id);
        if (!el) return;
        tl.seek(g.out + 0.01);
        var cs = window.getComputedStyle(el);
        if (cs.opacity !== "0" && cs.visibility !== "hidden") {
          console.warn("[caption-lint] " + g.id + " visible at t=" + (g.out + 0.01).toFixed(2));
        }
      });
      tl.seek(0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
